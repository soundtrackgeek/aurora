[package]
name = "aurora"
version = "0.15.20"
description = "A fast, local-first explorer for a personal music universe"
authors = ["Jørn Tillnes"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2.3.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
rodio = "0.22.2"
cpal = "0.17.3"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
percent-encoding = "2.3.2"
id3 = "1.17.0"
sha2 = "0.10.9"
