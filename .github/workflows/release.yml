name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect_version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - id: version
        env:
          VERSION_BASE_REF: ${{ github.event.before }}
        run: node scripts/detect-version-bump.mjs

  build:
    needs: detect_version
    if: needs.detect_version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --bundles nsis
            bundle: src-tauri/target/release/bundle
          - platform: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-release
      - run: npm ci
      - run: npm run check:version
      - name: Verify updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Configure TAURI_SIGNING_PRIVATE_KEY')"
      - name: Prepare Apple signing and notarization
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          node scripts/prepare-apple-signing.mjs
          keychain_password=$(openssl rand -hex 32)
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
      - name: Run verification gate
        run: npm run lint && npm test && npm run test:release && npm run build && cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check && cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers and signed updater archives
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run tauri -- build ${{ matrix.args }}
      - name: Verify universal architecture, Apple signature and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app="${{ matrix.bundle }}/macos/Aurora.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          xcrun lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          xcrun lipo "$app/Contents/MacOS/$executable" -verify_arch x86_64
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - run: node scripts/extract-release-notes.mjs "${{ needs.detect_version.outputs.version }}" release-notes.md
      - run: node scripts/prepare-release-assets.mjs "${{ needs.detect_version.outputs.version }}" "${{ needs.detect_version.outputs.tag }}" "${{ github.repository }}" "${{ matrix.platform }}" "${{ matrix.bundle }}" release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
      - name: Remove temporary Apple credentials
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notarization.p8"

  publish:
    needs: [detect_version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-inputs
      - run: node scripts/extract-release-notes.mjs "${{ needs.detect_version.outputs.version }}" release-notes.md
      - run: node scripts/merge-release-assets.mjs "${{ needs.detect_version.outputs.version }}" "${{ needs.detect_version.outputs.tag }}" "${{ github.repository }}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "${{ needs.detect_version.outputs.version }}" "${{ needs.detect_version.outputs.tag }}" "Aurora"
